analysis_rules:
  do_not_pool_units: true
  missing_targeted_gene_interpretation: "panel_unobserved_not_biological_negative"
  evidence_integration: "Compare direction and niche support across modalities; do not pool raw scores or p-values."
  required_programs: [LAMCORE, LAF_fibroblast, lymphatic_endothelial, immune, protease, antiprotease, ECM_remodeling]
