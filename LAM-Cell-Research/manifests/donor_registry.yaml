# Corrected evidence registry. PatientID is the independence key; SampleID is
# only a sequencing or spatial item. Same-donor assays add orthogonal evidence.
patient_id_policy:
  primary_key: patient_id
  sample_key: sample_id
  specimen_key: specimen_id
  same_donor_assays_are_independent_donors: false
  pending_identity_must_not_be_counted_as_independent: true

