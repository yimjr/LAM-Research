identity_protected:
  genes: [ACTA2, CTSK, FIGF, VEGFD, ESR1, HOXA11, HOXD11]
  note: "Sensitivity identity panel; candidate antigen/presentation/evasion genes are excluded."

antigen_associated:
  genes: [PMEL, MLANA, TYRP1, DCT, MITF, GPNMB]
